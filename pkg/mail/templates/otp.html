<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.AppName}} verification code</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
          <tr>
            <td style="font-size:18px;font-weight:600;padding-bottom:24px;">{{.AppName}}</td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.6;padding-bottom:24px;">
              Use this code to reset your password. It expires in {{.ExpiresMinutes}} minutes.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <div style="display:inline-block;font-size:32px;font-weight:700;letter-spacing:8px;font-family:'SFMono-Regular',Consolas,monospace;background:#f4f5f7;border-radius:8px;padding:16px 24px;">{{.Code}}</div>
            </td>
          </tr>
          <tr>
            <td style="font-size:13px;line-height:1.6;color:#656d76;">
              If you did not ask to reset your password, you can ignore this email. Never share this code with anyone.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
