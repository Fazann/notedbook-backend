# English — source of truth for translation keys.
# Keys: UPPER_SNAKE_CASE. Placeholders: {name}, filled from i18n.Err params.
# After adding or renaming a key, run `make locale` to regenerate pkg/i18n/keys_gen.go.

# Generic (also used for errors without a translation key, chosen by HTTP status)
BAD_REQUEST: "The request is invalid or malformed."
UNAUTHORIZED: "Authentication is required. Please sign in to continue."
FORBIDDEN: "You do not have permission to perform this action."
NOT_FOUND: "The requested resource was not found."
CONFLICT: "The request conflicts with the current state of the resource."
UNPROCESSABLE_ENTITY: "One or more fields are invalid. Please check your input and try again."
INTERNAL_SERVER_ERROR: "An unexpected error occurred. Please try again later."

# Common
INVALID_ID: "The provided ID is invalid."
RECORD_NOT_FOUND: "The requested record was not found."
TOO_MANY_REQUESTS: "Too many requests. Please try again in {seconds} seconds."

# Attachments
FILE_REQUIRED: "A file is required. Please select a file to upload."
FILE_TOO_LARGE: "The file exceeds the maximum allowed size of {max}."
ATTACHMENT_IN_USE: "This file is already used elsewhere. Please upload a new one."
INVALID_ATTACHMENT_TYPE: "The file type is not allowed. Allowed types: {types}."

# Users
INVALID_FULLNAME: "The full name is not valid."

# Expense categories
CATEGORY_IS_DEFAULT: "Default categories cannot be changed or deleted."
CATEGORY_NAME_TAKEN: "You already have a category with this name."
INVALID_CATEGORY_NAME: "The category name must be 1 to {max} characters."
INVALID_CATEGORY_ICON: "The category icon is not valid."
INVALID_CATEGORY_COLOR: "The category color is not valid."
UNSUPPORTED_LANGUAGE: "Only these languages are supported: {langs}."

# Expenses
INVALID_EXPENSE_CATEGORY: "The selected category does not exist."
INVALID_CURRENCY: "Only these currencies are supported: {currencies}."
INVALID_AMOUNT: "The amount must be between {min} and {max}, with at most {decimals} decimal places."

# Plans
INVALID_PLAN_AREA: "The selected plan area does not exist."

# Schedule
INVALID_TIME_RANGE: "End time must be after start time."
ACTIVITY_TOO_SHORT: "An activity must be at least {min} minutes."
RECURRENCE_DAYS_REQUIRED: "Choose at least one day."
INVALID_RECURRENCE_UNTIL: "End date must be on or after the start date."
INVALID_DATE_RANGE: "The date range is invalid; the maximum is {max} days."
SCOPE_DATE_REQUIRED: "A date is required when scope is \"this\"."

# Auth
INVALID_USERNAME: "The username is not valid."
INVALID_EMAIL: "The email address is not valid."
USERNAME_TAKEN: "This username is already taken."
EMAIL_TAKEN: "This email is already registered."
TOO_MANY_ATTEMPTS: "Too many attempts. Please try again in {minutes} minutes."
INVALID_CREDENTIALS: "The username or password is incorrect."
INCORRECT_PASSWORD: "The current password is incorrect."
ACCOUNT_DISABLED: "This account has been disabled."
TOKEN_EXPIRED: "Your session has expired. Please sign in again."
INVALID_OTP: "The code is incorrect or has expired."
OTP_TOO_MANY_ATTEMPTS: "Too many incorrect codes. Please request a new code."
INVALID_RESET_KEY: "This password reset request is invalid or has expired. Please start again."

# Validation ({field} is the JSON field name, e.g. device.os)
VALIDATION_FAILED: "One or more fields are invalid."
FIELD_REQUIRED: "{field} is required."
FIELD_INVALID: "{field} is invalid."
FIELD_INVALID_TYPE: "{field} must be a {type}."
FIELD_ONE_OF: "{field} must be one of: {values}."
FIELD_INVALID_EMAIL: "{field} must be a valid email address."
FIELD_MIN_LENGTH: "{field} must be at least {min} characters."
FIELD_MAX_LENGTH: "{field} must be at most {max} characters."
FIELD_EXACT_LENGTH: "{field} must be exactly {len} characters."
FIELD_MIN_VALUE: "{field} must be at least {min}."
FIELD_MAX_VALUE: "{field} must be at most {max}."
